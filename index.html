{n:26,f:"Questões Pop Prof RIna/1009587 - FCC - TJ MA/2019",t:`Considere o gráfico apresentado a seguir.

Estado do Maranhão − Composição do PIB − 2015
[Gráfico de barra única dividida em três partes: I ocupa de 0 a ~70%, II de ~70% a ~90%, III de ~90% a 100%]

Na composição do PIB (Produto Interno Bruto) maranhense, I e II correspondem, respectivamente, aos setores`,op:[["a","agropecuária e indústria."],["b","agropecuária e serviços."],["c","serviços e indústria."],["d","indústria e serviços."],["e","serviços e agropecuária"]],g:"c"},
{n:27,f:"Questões Pop Prof RIna/589450 - CEBRASPE - 1º Ten PM MA/2018",t:`[Figura I: climograma de São Luís (MA) - precipitação alta de janeiro a maio (pico ~450mm em março/abril), baixa de junho a dezembro; temperatura média estável entre 26-27°C o ano todo. Figura II: climograma de Colinas (MA) - precipitação com pico em março (~280mm), baixa de junho a setembro, leve alta em novembro-dezembro; temperatura com maior amplitude, mais alta de setembro a dezembro]
(F. Mendonça; Dani Oliveira. Climatologia: noções básicas e climas do Brasil. São Paulo: Oficina de Textos, 2007)

Tendo como referência as figuras precedentes e considerando que o estado do Maranhão situa-se em uma região controlada por massas de ar quente, julgue o item.

A regularidade térmica observada na cidade de São Luís ao longo do ano, conforme indicado na figura I, deve-se ao efeito da continentalidade.`,g:"errado"},
{n:28,f:"Questões Pop Prof RIna/589451 - CEBRASPE - 1º Ten PM MA/2018",t:`(Mesmo contexto das figuras climáticas de São Luís e Colinas da questão anterior.)

A maior pluviosidade nos meses de março e abril na porção norte do estado do Maranhão é efeito da zona de convergência intertropical (ZCIT).`,g:"certo"},
{n:29,f:"Questões Pop Prof RIna/589452 - CEBRASPE - 1º Ten PM MA/2018",t:`(Mesmo contexto das figuras climáticas de São Luís e Colinas.)

Em relação à variação sazonal, na cidade de Colinas, as temperaturas do ar mais elevadas ocorrem entre os meses de setembro e dezembro, em virtude das massas de ar seco.`,g:"certo"},
{n:30,f:"Questões Pop Prof RIna/589453 - CEBRASPE - 1º Ten PM MA/2018",t:`Duas linhas dirigiram o povoamento no Maranhão: a que invadiu o litoral e a que avançou pelos altos sertões, oriunda do interior nordestino.
(R. G. Rocha. O processo de ocupação do sul do Maranhão. In: Interespaço, v.1, n.1, 2015)

Com relação ao povoamento do Maranhão, julgue o item que se segue.

O povoamento da região litorânea e do alto sertão maranhense instituiu, nessas regiões, bases econômicas semelhantes.`,g:"errado"},
{n:31,f:"Questões Pop Prof RIna/589454 - CEBRASPE - 1º Ten PM MA/2018",t:`(Mesmo contexto sobre o povoamento do Maranhão.)

A ocupação do alto sertão maranhense foi realizada com o emprego da violência.`,g:"certo"},
{n:32,f:"Questões Pop Prof RIna/589455 - CEBRASPE - 1º Ten PM MA/2018",t:`Com relação à geomorfologia do território maranhense, julgue o item a seguir.

As atividades dos agentes modeladores do relevo revela um forte controle litológico no território maranhense.`,g:"errado"},
{n:33,f:"Questões Pop Prof RIna/589456 - CEBRASPE - 1º Ten PM MA/2018",t:`Com relação à geomorfologia do território maranhense, julgue o item a seguir.

O relevo do território maranhense apresenta feições típicas das bacias sedimentares com formas tabulares e subtabulares.`,g:"certo"},
{n:34,f:"Questões Pop Prof RIna/589986 - CEBRASPE - SM PM MA/2018",t:`Acerca da geodiversidade do estado do Maranhão, o qual é composto, em sua maior parte, por relevo plano a suave ondulado, com clima tropical e equatorial e onde se formam solos profundos excessivamente ácidos, com baixa fertilidade natural e baixa capacidade para reter nutrientes, julgue o item.

O relevo do estado é caracterizado por baixas superfícies de aplainamento em meio a extensas planícies fluviomarinhas, baixos platôs e chapadas.`,g:"certo"},
{n:35,f:"Questões Pop Prof RIna/589987 - CEBRASPE - SM PM MA/2018",t:`(Mesmo contexto sobre a geodiversidade do Maranhão.)

O Maranhão apresenta um conjunto de chapadas dissecadas por diversos processos erosivos e extensas planícies de deposição sedimentar que influenciam a geodiversidade do território desse estado.`,g:"certo"},
{n:36,f:"Questões Pop Prof RIna/589989 - CEBRASPE - SM PM MA/2018",t:`(Mesmo contexto sobre a geodiversidade do Maranhão.)

A vasta extensão de chapadas maranhenses se estende pelas bacias hidrográficas dos rios Parnaíba, Amazonas e Jaguaribe.`,g:"errado"},
{n:37,f:"Questões Pop Prof RIna/589990 - CEBRASPE - SM PM MA/2018",t:`(Mesmo contexto sobre a geodiversidade do Maranhão.)

A formação geomorfológica do estado é composta, predominantemente, por rochas de origem ígnea e metamórficas.`,g:"errado"},
{n:38,f:"Questões Pop Prof RIna/589995 - CEBRASPE - SM PM MA/2018",t:`O tardio processo de industrialização maranhense se iniciou no fim da década de 60 do século XX, com a construção da rodovia Belém–Brasília e de estradas regionais como São Luís–Belém e São Luís–Teresina. Porém, foi na década de 70, quando massivos aportes foram incorporados à política de industrialização, principalmente por meio do modelo de desenvolvimento do II PND e da criação da SUDAM e SUDENE, que esse processo tomou impulso.
(Claudiomar M. R. Filho. Formação econômica do Maranhão, 2016)

Julgue o item subsequente.

A criação do Consórcio Siderúrgico do Maranhão, a ALUMAR — siderúrgica produtora de ferro-gusa e aços inoxidáveis — foi um dos principais investimentos da política de industrialização tardia do Maranhão.`,g:"errado"},
{n:39,f:"Questões Pop Prof RIna/589996 - CEBRASPE - SM PM MA/2018",t:`O estado do Maranhão é um dos dez maiores estados do Brasil e contempla três diferentes biomas: o Cerrado; a Amazônia e uma pequena porção do bioma Caatinga. Julgue o item seguinte.

As dunas do litoral maranhense resultam da ação do clima semiárido presente em grande parte do oeste do estado.`,g:"errado"},
{n:40,f:"Questões Pop Prof RIna/589997 - CEBRASPE - SM PM MA/2018",t:`(Mesmo contexto sobre os biomas do Maranhão.)

Na Floresta dos Guarás, situada no litoral maranhense a oeste da capital São Luís, estão alguns dos mais extensos e bem conservados manguezais do Nordeste, lugares de grande concentração de ninhais e dormidouros de aves como o Guará.`,g:"certo"},
{n:41,f:"Questões Pop Prof RIna/589998 - CEBRASPE - SM PM MA/2018",t:`(Mesmo contexto sobre os biomas do Maranhão.)

A área de proteção ambiental dos Lençóis Maranhenses é uma reserva extrativista onde é permitida a exploração sustentável dos mangues e da mata de cocais pelas populações locais.`,g:"errado"},
{n:42,f:"Questões Pop Prof RIna/628077 - FCC - AGED MA/2018",t:`Considere o mapa do Maranhão abaixo.

Maranhão − tipos climáticos
[Mapa: região 1 a noroeste/litoral, 2 no centro-oeste, 3 a nordeste/leste, 4 no extremo sul]

De acordo com o mapa, em`,op:[["a","3, as variações de temperatura estão relacionadas à massa de ar Tropical Atlântica."],["b","2, a amplitude térmica anual é superior a 8 °C, principalmente nas áreas mais próximas do litoral."],["c","2 pode-se observar umidade relativa do ar próxima a 80% durante todo o ano."],["d","1 encontram-se os maiores índices de precipitação atmosférica do estado."],["e","4, os efeitos da continentalidade tornam as temperaturas mais baixas e oscilantes."]],g:"d"},
{n:43,f:"Questões Pop Prof RIna/628078 - FCC - AGED MA/2018",t:`É a maior bacia hidrográfica do Maranhão e ocupa cerca de 29,84% da área total do Estado; abriga 83 municípios, que juntos somam 1.681.307 habitantes − o que representa 25,6% da população maranhense, segundo dados do IBGE. O principal rio desta bacia tem pouco mais de 900 quilômetros de extensão e deságua na baía de São Marcos onde há extensa área de mangues.

Trata-se da bacia hidrográfica do rio`,op:[["a","Itapecuru."],["b","Mearim."],["c","Turiaçu."],["d","Pindaré."],["e","Grajaú."]],g:"b"},
{n:44,f:"Questões Pop Prof RIna/628079 - FCC - AGED MA/2018",t:`Considere o mapa do Maranhão abaixo.
[Mapa numerado: 1 ao norte, 2 a noroeste, 3 ao sul, 4 a nordeste, 5 no centro]

As Chapadas do Alto Rio Parnaíba consistem de vastas superfícies planálticas de extensos topos planos e não dissecados, alçadas em cotas que variam entre 350 m e 600 m de altitude. Esse conjunto de chapadas foi genericamente denominado Serra do Penitente.

No mapa acima as Chapadas estão indicadas pelo número`,op:[["a","5"],["b","1"],["c","2"],["d","4"],["e","3"]],g:"e"},
{n:45,f:"Questões Pop Prof RIna/628080 - FCC - AGED MA/2018",t:`Segundo o Instituto Maranhense de Estudos Socioeconômicos e Cartográficos − IMESC as projeções de crescimento do Produto Interno Bruto − PIB maranhense em 2017 foram favoráveis. Um dos fatores para o crescimento do PIB maranhense foi`,op:[["a","o início da exploração de petróleo na bacia do Parnaíba."],["b","a expansão do extrativismo do babaçu."],["c","o bom desempenho do setor agropecuário."],["d","a implantação de novas indústrias têxteis e de confecções."],["e","o aumento das exportações de minérios"]],g:"c"},
{n:46,f:"Questões Pop Prof RIna/628081 - FCC - AGED MA/2018",t:`Sobre a agropecuária maranhense é correto afirmar que`,op:[["a","a nova fronteira agrícola em expansão no centro-sul do estado tem exercido forte pressão sobre o cerrado."],["b","o leste do estado abriga importante atividade relacionada ao cultivo de eucaliptos para a indústria"],["c","a principal área de pecuária bovina do estado ocupa pastagens cultivadas em substituição à caatinga."],["d","o moderno cultivo comercial do arroz transformou o estado no maior produtor nacional do cereal em 2017."],["e","a agricultura familiar reduziu o espaço no estado que, atualmente, precisa importar café e mandioca do Piauí."]],g:"a"},
{n:47,f:"Questões Pop Prof RIna/628083 - FCC - AGED MA/2018",t:`Considere o gráfico abaixo.

Maranhão: Evolução da população urbana
[Gráfico de linha crescente: 1970 ~25%, 1980 ~30%, 1991 ~40%, 2000 ~59%, 2010 ~63%. IBGE]

A leitura do gráfico e os conhecimentos sobre a população maranhense permitem afirmar que o crescimento da população urbana no período deve-se, entre outros fatores,`,op:[["a","à incorporação de novas áreas com forte potencial de crescimento econômico, a exemplo do baixo Parnaíba."],["b","às migrações de retorno que se intensificaram com as novas atividades econômicas no estado."],["c","aos investimentos realizados no sentido de melhorar a posição do estado como o menos urbanizado do Brasil."],["d","à redução do déficit habitacional em várias médias cidades, o que as transformaram em polos de crescimento demográfico."],["e","à migração da zona rural com destino urbano, sobretudo dentro do próprio estado."]],g:"e"},
{n:48,f:"Questões Pop Prof RIna/448741 - CEBRASPE - Prof (Pref São Luís)/2017",t:`Tendo em vista que as alterações dos usos e da cobertura do solo na Amazônia maranhense foram marcadas historicamente pela acelerada expansão do desmatamento para fins de implantação de toda logística para a manutenção do agronegócio, e que esse contexto impulsionou o surgimento de grandes processos erosivos e de assoreamento de diversos cursos d'água da região, assinale a opção correta.`,op:[["a","O assoreamento reduz o volume das lâminas d'água e as torna mais claras e aquecidas, o que aumenta a ação fotossintética das algas e promove a eutroficação."],["b","A colmatação é consequência do processo de assoreamento e leva ao estreitamento do curso de água e ao aumento da força das correntes."],["c","A ocupação desordenada das áreas de preservação de rios promove redução no escoamento superficial das águas, o que contribui para a formação de processos erosivos."],["d","Processos de assoreamento são inerentemente relacionados a processos erosivos, uma vez que destes resultam sedimentos que, transportados pela correnteza, se depositam no leito dos rios."],["e","O desmatamento das áreas de preservação dos rios promove aumento da lixiviação dos solos, que é causa de assoreamento e de redução da qualidade da água."]],g:"d"},
{n:49,f:"Questões Pop Prof RIna/448752 - CEBRASPE - Prof (Pref São Luís)/2017",t:`O estado do Maranhão apresenta notável singularidade no contexto brasileiro em razão dos importantes domínios de natureza que nele se encontram. Esses domínios incluem`,op:[["a","solos férteis derivados de derrames basálticos, revestidos por mata de cocais."],["b","baixadas litorâneas de alta biodiversidade, embora ocupem uma pequena área do estado."],["c","formações costeiras caracterizadas por extenso campo de cerrado, de clima desértico."],["d","espécies nativas do ecossistema subtropical brasileiro, como o pinheiro do Paraná."],["e","faixas de transição que reúnem espécies de ecossistemas amazônicos e do cerrado."]],g:"e"},
{n:50,f:"Questões Pop Prof RIna/448754 - CEBRASPE - Prof (Pref São Luís)/2017",t:`A região denominada MATOPIBA, da qual o Maranhão faz parte, tornou-se alvo de investimentos nos últimos anos. Com relação à dinâmica socioeconômica dessa região, assinale a opção correta.`,op:[["a","Devido à predominância da agricultura familiar em MATOPIBA, tradicional no Maranhão, grandes agricultores deixaram de encontrar terras para investir na implantação de monoculturas na região."],["b","Essa região compreende parte do território do Maranhão em que se notam excelentes índices de desenvolvimento humano (IDH), dado o crescimento econômico verificado."],["c","Os investimentos agrícolas em MATOPIBA garantiram sucesso na produção, com destaque, por exemplo, para o cultivo do feijão."],["d","Os estados da região de MATOPIBA colaboram como fornecedores de insumos tecnológicos, beneficiando-se do crescimento das atividades econômicas implantadas na região."],["e","No Maranhão, observa-se a instauração de um fluxo migratório em função da oferta de emprego na região de MATOPIBA, o que tem provocado decréscimo populacional na capital do estado."]],g:"c"},
{n:51,f:"Questões Pop Prof RIna/448755 - CEBRASPE - Prof (Pref São Luís)/2017",t:`Assinale a opção correta, acerca de aspectos naturais do estado do Maranhão e seu aproveitamento nas atividades humanas.`,op:[["a","As maiores altitudes são encontradas no norte do estado, onde as médias de temperatura anual são inferiores a 20 °C."],["b","O norte do estado corresponde a terrenos sedimentares da bacia do rio Parnaíba, com potencial de geração de hidroeletricidade."],["c","As formas de relevo encontradas no estado impossibilitam a agricultura mecanizada."],["d","A topografia condiciona um padrão de drenagem de orientação norte-sul."],["e","O estado apresenta relevo planáltico, com presença de chapadas."]],g:"e"},
{n:52,f:"Questões Pop Prof RIna/448756 - CEBRASPE - Prof (Pref São Luís)/2017",t:`O clima quente e úmido do estado do Maranhão deve-se à`,op:[["a","proximidade com o Equador, o que garante a expressiva incidência solar durante todo o ano e, consequentemente, altas temperaturas."],["b","alta latitude em que o estado se situa, o que facilita a entrada de ventos alísios, carregados de umidade e responsáveis pelas chuvas."],["c","faixa litorânea maranhense, que impede a presença de clima seco."],["d","topografia do estado, que favorece o aquecimento adiabático e a evaporação da umidade do ar, o que promove altos índices pluviométricos."],["e","presença da floresta tropical amazônica, que recobre a maior parte do estado e é responsável pelas chuvas abundantes."]],g:"a"},
{n:53,f:"Questões Pop Prof RIna/448757 - CEBRASPE - Prof (Pref São Luís)/2017",t:`Crescimento populacional do Maranhão
[Gráfico: 1940: 1.231.955; 1950: 1.577.838; 1960: 2.477.371; 1970: 2.992.686; 1980: 4.673.100; 1991: 5.181.800; 1996: 5.222.183; 2000: 5.638.381; 2010: 6.569.683]

De acordo com o IBGE, essa tendência de crescimento tem-se mantido. Considerando esse gráfico e as informações relativas a ele, assinale a opção correta.`,op:[["a","Infere-se dos dados apresentados no gráfico que tem ocorrido aumento contínuo na taxa de natalidade do estado."],["b","Comparada aos demais intervalos mostrados no gráfico, a década de 70 a 80 do século passado foi aquela em que o Maranhão registrou o menor aumento em seu contingente populacional."],["c","O crescimento populacional, no período mostrado no gráfico, ocorreu a taxas variáveis."],["d","Entre os anos de 2000 e 2010, o estado apresentou o menor crescimento em relação aos demais intervalos mostrados no gráfico."],["e","A transição demográfica marca a evolução da população do estado."]],g:"c"},
{n:54,f:"Questões Pop Prof RIna/448758 - CEBRASPE - Prof (Pref São Luís)/2017",t:`Com relação à dinâmica e à distribuição populacional no Maranhão, assinale a opção correta.`,op:[["a","A cidade de Imperatriz é a mais populosa do estado."],["b","Em função do volume da produção no setor primário da economia, atualmente a população maranhense é majoritariamente rural."],["c","O setor de serviços nas grandes cidades do estado tem liberado mão de obra para o campo."],["d","Fatores de ordem social e econômica influenciam a existência de fluxos migratórios da população maranhense para outros estados brasileiros."],["e","Tem havido maior concentração da população no sul do estado, devido aos fluxos imigratórios."]],g:"d"},
{n:55,f:"Questões Pop Prof RIna/448759 - CEBRASPE - Prof (Pref São Luís)/2017",t:`Recentemente, o Maranhão entrou em emergência por causa de incêndios. Somente em outubro, foram registrados mais de quatro mil focos. As queimadas sem controle já desabrigaram cem famílias em cinco cidades no leste do Maranhão, em menos de uma semana.

Uma das consequências dos incêndios no Maranhão é o`,op:[["a","aumento da área do bioma semiárido nordestino."],["b","esvaziamento permanente das populações atingidas."],["c","aumento da fertilidade dos solos das áreas de cultivo agrícola do estado, graças ao acréscimo de carbono."],["d","decréscimo da biodiversidade local."],["e","combate a pragas que assolam as safras e os parques nacionais."]],g:"d"},
{n:56,f:"Questões Pop Prof RIna/448761 - CEBRASPE - Prof (Pref São Luís)/2017",t:`Terras do oeste maranhense estão incluídas no Programa Grande Carajás (PGC). Essa região participa nas atividades do PGC com`,op:[["a","atividades industriais ligadas ao beneficiamento do arroz e da mandioca."],["b","atividades petroquímicas, que integram o setor mais importante do oeste maranhense."],["c","o fornecimento de energia elétrica, para o abastecimento das indústrias de alumínio."],["d","o transporte de cargas da companhia Vale do Rio Doce pela Estrada de Ferro Carajás."],["e","a exploração de minério de ferro para exportação."]],g:"d"},
{n:57,f:"Questões Pop Prof RIna/448762 - CEBRASPE - Prof (Pref São Luís)/2017",t:`Um estudo divulgado pela Confederação Nacional da Indústria (CNI) mostrou que 15,6% das riquezas maranhenses são geradas pelo setor industrial. De acordo com o perfil da indústria nos estados, esse setor emprega, no Maranhão, mais de 110 mil pessoas, o que corresponde a 0,9% da força de trabalho da indústria brasileira. (notícia de novembro de 2014)

Assinale a opção correta, a respeito dos setores econômicos no estado do Maranhão.`,op:[["a","O setor industrial emprega a maior parte da população economicamente ativa do estado."],["b","Ao contrário da indústria, que apresenta crescimento, a agricultura é uma atividade econômica em declínio no estado."],["c","A maior parte do PIB do estado é gerada pelo setor industrial."],["d","O estado passou a figurar entre os mais industrializados do Brasil."],["e","Investimentos em infraestrutura contribuíram para alavancar a economia industrial do estado."]],g:"e"},
{n:58,f:"Questões Pop Prof RIna/407301 - FCC - SEMA MA/2016",t:`"São áreas com alto potencial social. Estão dotadas de infraestrutura suficiente para o desenvolvimento das atividades agrícolas, agropecuárias, florestais, industriais e minerárias consolidadas, sobretudo atendidas por vias de acesso e escoamento da produção consolidada. O custo de oportunidade da preservação da vegetação nativa se tornou excessivamente elevado para garantir a conservação destas áreas fora das APP's ou reserva legal. A aptidão agrícola predominantemente é considerada boa. Apresenta vulnerabilidade natural à erosão predominantemente baixa." (seplan.ma.gov.br)

As diretrizes compatíveis com a vulnerabilidade natural a erosão considerando as características descritas na zona do Macrozoneamento Ecológico e Econômico do Estado do Maranhão são:`,op:[["a","Áreas prioritárias para estudos complementares e mais detalhados para avaliação mais criteriosa das características socioeconômicas e ecológicas, e subsídio a destinação mais adequada desta área."],["b","Desenvolvimento das atividades primárias nas áreas desmatadas ou convertidas para outros usos agropecuário ou agrícola, com práticas adequadas e manejo no uso dos recursos naturais, especialmente o solo, preservando os remanescentes de vegetação natural."],["c","Atividades das comunidades tradicionais e indígenas podem ser fomentadas, mas carecem de ordenamento, organização, controle e desenvolvimento e políticas públicas e investimentos devem ser controlados e direcionados levando em conta as limitações e fragilidades ambientais locais."],["d","Garantir a integridade do ecossistema e áreas prioritárias para estudos complementares e mais detalhados para avaliação mais criteriosa das características socioeconômicas e ecofisiológicas."],["e","O desmatamento incremental deve ser criterioso e evitado, de forma a manter as características naturais no entorno de áreas de florestas de manguezais e trata-se também de áreas onde o pagamento por serviços ambientais deve ser intensificados favorecendo os moradores locais."]],g:"b"},
{n:59,f:"Questões Pop Prof RIna/407308 - FCC - SEMA MA/2016",t:`No sul do Maranhão observou-se, nas últimas décadas, uma intensa transformação territorial e segundo Santos, 1996:244 a região é "um espaço nacional da econômica internacional".

Esta frase se refere ao fato`,op:[["a","da ascensão do capital internacional na industrialização regional."],["b","da sojicultura ter promovido a instalação de novos empreendimentos e da queda do crescimento demográfico."],["c","da ampliação de pesquisa e tecnologia em zootecnia auxiliada por satélites."],["d","da utilização de maquinário moderno, computadores de última geração a baixo custo e sistema de telefonia."],["e","das empresas de sojicultura se tornarem mais competitivas no setor de commodities agrícolas."]],g:"e"},
{n:60,f:"Questões Pop Prof RIna/407311 - FCC - SEMA MA/2016",t:`O Estado do Maranhão, tal qual a Amazônia, foi e continua sendo alvo de uma série de políticas de ordenação e uso do território as quais iniciaram-se ainda no regime colonial e que, no transcorrer do século XX principalmente nos Governos militares, intensificaram-se na medida em que foram sendo definidas as respectivas "vocações" territoriais, as quais buscaram articular-se a um projeto nacional de desenvolvimento e tornar a economia competitiva no mercado global. (ROMÃO et al., 2011)

Considerando que as intervenções Estatais influem nas novas territorializações e promovem ao mesmo tempo desterritorialização, o projeto que articulou uma política nacional à formação territorial do Estado do Maranhão no século XX, foi a`,op:[["a","implantação, no município de Alcântara de um centro de alta tecnologia de lançamento de foguetes que provocou a desterritorialização de comunidades quilombolas e tradicionais."],["b","implantação do Porto de Itaqui na baía de São Marcos que provocou um forte investimento em melhorias urbanas atraindo setores sociais de alta renda para a região."],["c","implantação da ferrovia Norte-Sul que promoveu um choque negativo na porosidade territorial e facilitou a relação com o exterior incentivando a exportação de commodities agrícolas."],["d","expansão das rodovias que levou a região da Baixada Maranhense a falência do modelo agroexportador e confinou essa região ao contato apenas com as localidades mais próximas, configurando um ambiente de marasmo."],["e","expansão de todas as infraestruturas territoriais, que promoveram somente o setor de exportação não trazendo nenhum benefício social."]],g:"a"},
{n:61,f:"Questões Pop Prof RIna/407313 - FCC - SEMA MA/2016",t:`Em relação a organização espacial da cidade de São Luís do Maranhão:`,op:[["a","O espaço urbano e sua paisagem expressam-se fragmentados e interligados por políticas territoriais urbanas."],["b","A cidade possui um amplo segmento da população que se organizou a partir dos princípios constitucionais como: moradia, saúde, segurança e dignidade."],["c","A cidade possui uma organização trivial das cidades subdesenvolvidas, na qual a divisão do território urbano, se dá pela definição de periferia e centro."],["d","São Luís é uma cidade em harmonia que se processa evidenciando um antagonismo dada a intensidade e veloz metamorfose urbana que não reflete a sua história."],["e","São Luís é uma cidade segregada mas nas últimas décadas vem experimentando uma forte transformação territorial para reduzir as desigualdades sociais."]],g:"c"},
{n:62,f:"Questões Pop Prof RIna/407314 - FCC - SEMA MA/2016",t:`Considere a figura abaixo.

A evolução da área plantada da lavoura temporária no Maranhão (1990-2005)
[Pizza 1990: Soja 1%, Alimentos básicos 35%, Outros produtos 64%. Pizza 2005: Soja 23%, Alimentos básicos 27%, Outros produtos 50%. *Alimentos básicos: arroz, mandioca e feijão. IBGE]

Nas últimas décadas verificou-se no Estado do Maranhão um processo intenso de substituição das lavouras destinadas aos alimentos básicos, tais como o arroz, em detrimento à expansão do agronegócio sojicultor. O aumento da cultura de soja se deve, dentre outros fatores`,op:[["a",`à "ajuda" estatal às empresas cooperativistas de comunidades tradicionais que sempre viveram na região sul-maranhense.`],["b","à adoção de incentivos fiscais favoráveis à exportação por parte do estado."],["c","ao crescimento na produção de soja em outras regiões do Brasil."],["d","à aceleração da mesorregião Sul do Maranhão em detrimento do Leste, em função da sua produtividade."],["e","à produção de soja ser muito antiga nesta microrregião e sempre ter obtido significativos ganhos de produtividade em relação a outras regiões do Estado."]],g:"b"},
{n:63,f:"Questões Pop Prof RIna/407321 - FCC - SEMA MA/2016",t:`Considere o mapa abaixo.

Comunidades e Territórios Quilombolas Auto-Identificados no Maranhão
[Mapa por mesorregião: Norte Maranhense 592 comunidades (maior concentração, inclui Alcântara e Itapecuru Mirim); Oeste Maranhense 152; Centro Maranhense 51; Leste Maranhense 38; Sul Maranhense 0. Fonte: FCP, UNB, SEPPIR, INCRA, UFAP, Programa Raízes, CEDENPA, NAEA]

O Maranhão é considerado uma sociedade de origem escravista tardia. Foi no final do século XVIII que se desenvolveu mais fortemente uma escravidão agrícola na região, ainda que desde o século anterior escravos africanos tivessem sido utilizados como mão-de-obra. (Assunção, 1996: 434)

A partir do mapa e do texto conclui-se que a região`,op:[["a","leste concentra grande número de comunidades quilombolas com um número pequeno de comunidades por município."],["b","norte concentra o maior número de quilombos por mesorregião e também o maior número de comunidades por municípios, consequência do trabalho escravista de séculos anteriores."],["c","oeste não apresenta municípios com comunidades quilombolas e o número de comunidades é o mais baixo."],["d","centro não apresenta um número significativo de comunidades quilombolas e o número de comunidades por município é o menor."],["e","sul apresenta ao mesmo tempo um número de comunidades por município baixo e um número de comunidades por mesorregião médio."]],g:"b"},
{n:64,f:"Questões Pop Prof RIna/1302251 - Inst. Coelho Neto - Pref S Amaro MA/2016",t:`Analise as proposições sobre o Estado do Maranhão.

I. O estado do Maranhão está dividido em cinco mesorregiões.
II. A Oeste, o Maranhão limita-se com o estado do Piauí.
III. O clima equatorial é predominante na porção leste do estado, apresentando altas médias pluviométricas e temperaturas elevadas.
IV. Possui a segunda maior costa litorânea brasileira.

Assinale a opção correta.`,op:[["a","Apenas as proposições II e III são falsas."],["b","Apenas a proposição I é verdadeira."],["c","Apenas as proposições I e III são verdadeiras."],["d","As proposições I, II, III e IV são falsas."],["e","Apenas as proposições I e II são verdadeiras."]],g:"a"},
{n:65,f:"Questões Pop Prof RIna/1303680 - Inst. Coelho Neto - Pref S Amaro MA/2016",t:`Sobre a hidrografia do Maranhão é incorreto afirmar:`,op:[["a","O rio Itapecuru banha as cidades de Colinas, Codó e Rosário."],["b","Possui predominância de rios intermitentes."],["c","A Baixada Maranhense caracteriza-se pela grande concentração de lagos."],["d","Predomínio de rios com drenagem do tipo exorréica."],["e","A rede hidrográfica maranhense caracteriza-se pelo domínio de rios com foz do tipo estuário."]],g:"b"},
{n:66,f:"Questões Pop Prof RIna/2479995 - FSADU UFMA - IF MA/2015",t:`É consenso afirmar que o processo de ocupação do espaço maranhense desenvolveu-se a partir do que se convencionou chamar de correntes de povoamento, as quais ocorreram em tempos diferentes, bem como avançaram pelo território em direções distintas, dando origem a várias cidades e proporcionando o desenvolvimento de atividades econômicas diversas. Acerca das correntes de povoamento do espaço maranhense, pode-se afirmar que`,op:[["a","no século XIX, os migrantes da seca avançaram pelo interior do Maranhão, pelos vales dos rios Parnaíba e Manoel Alves Grande, alcançando municípios como Caxias e Imperatriz."],["b","no século XVI, os franceses começaram a colonização do Maranhão, estabelecendo-se em 1612, na ilha do Maranhão, iniciando, assim, o processo de ocupação a partir dos cursos fluviais."],["c","no século XVIII, os portugueses efetivaram a ocupação costeira avançando para o litoral leste e oeste, como também pelo vale úmido do rio Pindaré."],["d","no século XVII, deu-se a corrente dos criadores de gado, vindos da região da caatinga nordestina em direção ao interior do Maranhão, especialmente o vale úmido do rio Itapecuru."],["e","o fracasso do sistema de capitanias hereditárias fez com que o Maranhão permanecesse por longo tempo esquecido pela Coroa Portuguesa. Em tal período, a costa do Estado tornou-se alvo de piratas e traficantes."]],g:"e"},
{n:67,f:"Questões Pop Prof RIna/2479996 - FSADU UFMA - IF MA/2015",t:`Com relação às mesorregiões do Maranhão, é CORRETO afirmar que`,op:[["a","a mesorregião Centro Maranhense engloba três microrregiões e destacam-se as atividades da rizicultura, pecuária leiteira e o extrativismo do babaçu."],["b","a mesorregião Leste Maranhense teve sua ocupação associada à integração da chamada pré-amazônia à economia nacional por meio das frentes."],["c","a mesorregião Oeste Maranhense hoje se destaca também na produção de soja, representando uma nova fronteira agrícola para esse produto."],["d","a mesorregião Sul Maranhense tem, como maior destaque, a criação do rebanho bovino de forma extensiva, com projetos voltados para a pecuária de corte."],["e","a mesorregião Norte Maranhense apresenta quadro natural diversificado, com atividades econômicas restritas às indústrias de óleos, gorduras e ceras vegetais."]],g:"a"},
{n:68,f:"Questões Pop Prof RIna/2479999 - FSADU UFMA - IF MA/2015",t:`A vegetação do Estado do Maranhão reflete a sua localização, na transição entre o Nordeste e a região Norte. Destacam-se, no Estado, as áreas de floresta ombrófila, cerrado, mangue, campos inundáveis e vegetação de dunas e restingas. Com relação às características das formações vegetais no Maranhão, assinale a opção CORRETA.`,op:[["a","A floresta ombrófila ocupa a porção nordeste do Estado, subdividindo-se em aluvial, de platôs e submontana."],["b","O cerrado constitui o maior bioma do Maranhão, ocupando o leste e o sul do Estado, com densidade variando conforme o padrão de umidade."],["c","O manguezal ocupa a faixa litorânea, especialmente na sua porção oriental, onde é mais preservado."],["d","Os campos inundáveis, considerados áreas de influência exclusiva dos cursos fluviais, ocorrem na Baixada Maranhense."],["e","As dunas e restingas ocorrem na faixa litorânea, especialmente na parte ocidental, com destaque para o Parque Nacional dos Lençóis Maranhenses."]],g:"b"},
{n:69,f:"Questões Pop Prof RIna/2480002 - FSADU UFMA - IF MA/2015",t:`Com o método de classificação proposto por Thorntwaite (1948), foram identificados quatro tipos climáticos no Maranhão. O Clima Úmido do tipo B2 com pequena ou nenhuma deficiência hídrica anual, temperaturas médias anuais entre 26°C e 27°C e umidade relativa do ar anual próxima a 80%, é encontrado em que parte do Maranhão?`,op:[["a","Sul."],["b","Nordeste."],["c","Centro-Oeste."],["d","Extremo Noroeste."],["e","Extremo Leste."]],g:"d"},
{n:70,f:"Questões Pop Prof RIna/2480009 - FSADU UFMA - IF MA/2015",t:`"Formações abertas, rasteiras, relacionados com solos gleissolos em áreas planas, inundáveis, com fisionomia campestre, onde ocorrem espécies como: piri, canarana e capins-junco, com presença ou não de carnaubeiras, onde, atualmente, são mais aproveitados com pecuária extensiva de bovinos e bubalinos." (Uema, Atlas do Maranhão, 2002, p. 22)

A descrição acima refere-se a que vegetação presente no Maranhão?`,op:[["a","Campos inundáveis da Baixada."],["b","Campos inundáveis litorâneos."],["c","Cerrado."],["d","Caatinga."],["e","Restinga."]],g:"a"},
{n:71,f:"Questões Pop Prof RIna/1184953 - Instituto Ludus - CRF MA/2014",t:`Não é rio que integra a bacia hidrográfica do Maranhão`,op:[["a","Rio Parnaíba."],["b","Rio Munim."],["c","Rio Maranhão."],["d","Rio Preguiça."],["e","Rio Gurupi"]],g:"c"},
{n:72,f:"Questões Pop Prof RIna/1184954 - Instituto Ludus - CRF MA/2014",t:`O Maranhão é integrado por quantas Microrregiões?`,op:[["a","21."],["b","20."],["c","19."],["d","18."],["e","17."]],g:"a"},
{n:73,f:"Questões Pop Prof RIna/1184955 - Instituto Ludus - CRF MA/2014",t:`É extremo Leste do Estado do Maranhão está situado no Município de`,op:[["a","Araioses."],["b","Magalhães de Almeida."],["c","Água Doce do Maranhão."],["d","Barão de Grajaú."],["e","São Francisco do Maranhão."]],g:"a"},
{n:74,f:"Questões Pop Prof RIna/1184957 - Instituto Ludus - CRF MA/2014",t:`Uma das formações vegetais do Maranhão é a savana, região com predominância de vegetação xeromorfa aberta, dominada e marcada por um estrato herbáceo. Alternam-se às vezes pequenas árvores isoladas. Assinale, dentre as alternativas seguintes, aquela que não relaciona espécie (vegetal) comum na savana maranhense.`,op:[["a","araticum."],["b","pequi."],["c","cajuí."],["d","murici."],["e","sucupira."]],g:"b"},
{n:75,f:"Questões Pop Prof RIna/1185015 - Instituto Ludus - CRF MA/2014",t:`No Maranhão, alguns Municípios fazem divisa com mais de um Estado Federado. Um deles é`,op:[["a","Alto Parnaíba."],["b","Carolina."],["c","Boa Vista do Gurupi."],["d","Itinga do Maranhão."],["e","Tasso Fragoso."]],g:"a"},
{n:76,f:"Questões Pop Prof RIna/1185017 - Instituto Ludus - CRF MA/2014",t:`O Maranhão apresenta algumas elevações que formam o grande dispersor d'água, pois é onde originam-se os principais rios que formam a rede hidrográfica do Estado. Uma dessas serras está situada entre os Municípios de São Raimundo das Mangabeiras até Loreto, separando os vales dos rios Balsas e o Alto Itapecuru. Trata-se da`,op:[["a","Serra do Cintra."],["b","Serra da Croeira."],["c","Serra do Valentim."],["d","Chapada das Mangabeiras."],["e","Serra Vermelha."]],g:"e"},
{n:77,f:"Questões Pop Prof RIna/1185018 - Instituto Ludus - CRF MA/2014",t:`É uma BR (Rodovia Federal) que não corta o Maranhão.`,op:[["a","BR-010."],["b","BR-226."],["c","BR-343."],["d","BR-222."],["e","BR-230."]],g:"c"},
{n:78,f:"Questões Pop Prof RIna/200141 - FGV - CBM MA/2012",t:`Dentre as unidades de conservação existentes no Brasil para preservação do meio ambiente, os Parques Nacionais tem como objetivo a preservação de ecossistemas naturais de grande relevância ecológica e beleza cênica. Criado em 1981, o Parque Nacional dos Lençóis Maranhenses garante a proteção de um dos principais patrimônios do estado do Maranhão e do país.

Com relação ao Parque Nacional dos Lençóis Maranhenses, analise as afirmativas a seguir:

I. O parque abrange áreas dos municípios maranhenses de Barreirinhas, Primeira Cruz e Açailândia.
II. Entre as dunas ativas situadas na área do parque ocorrem lagoas temporárias ou permanentes.
III. A pluviometria local é marcada pelo elevado índice de chuvas e pela regularidade da distribuição ao longo do ano.

Assinale:`,op:[["a","se somente a afirmativa I estiver correta."],["b","se somente a afirmativa II estiver correta."],["c","se somente a afirmativa III estiver correta."],["d","se somente as afirmativas II e III estiverem corretas."],["e","se todas as afirmativas estiverem corretas."]],g:"b"},
{n:79,f:"Questões Pop Prof RIna/200142 - FGV - CBM MA/2012",t:`Atualmente, as bacias hidrográficas vêm sendo adotadas como unidades de planejamento ambiental. As bacias limítrofes, compostas por rios que atravessam limites político-administrativos, representam um desafio para a gestão integrada dos recursos hídricos.

Sobre as bacias limítrofes maranhenses, assinale a afirmativa correta.`,op:[["a","Entre as bacias limítrofes, a do rio Parnaíba é a que possui a maior área no estado do Maranhão."],["b","A bacia do rio Tocantins abrange, entre outros, os estados de Tocantins, Pará, Maranhão e Piauí."],["c","A bacia do Rio Mearim abrange as áreas limítrofes do Maranhão com o estado do Piauí."],["d","A área ocupada pelas bacias limítrofes no território do Maranhão é maior que a área ocupada pelas bacias dos rios genuinamente maranhenses."],["e","O Rio Gurupi constitui um trecho da linha limítrofe entre os estados do Maranhão e do Piauí."]],g:"a"},
{n:80,f:"Questões Pop Prof RIna/200143 - FGV - CBM MA/2012",t:`Na década de 1970, o cultivo da soja passou a ocupar áreas do Centro-Oeste brasileiro. A partir da década de 1990 uma nova fronteira agrícola surgiu com a expansão da sojicultura nos estados do Maranhão, Piauí, Tocantins e Pará.

Com relação ao cultivo da soja no Maranhão, analise as afirmativas a seguir.

I. As empresas exportadoras de soja se utilizam, além de outros modais, da logística da Estrada de Ferro Carajás para o escoamento da produção.
II. A área plantada e a produção de soja, no período de 1990 a 2005, apresentaram um grande crescimento.
III. Os principais municípios produtores de soja no Maranhão estão situados no sul do estado e na divisa com o estado do Piauí.

Assinale:`,op:[["a","se somente a afirmativa I estiver correta."],["b","se somente a afirmativa II estiver correta."],["c","se somente a afirmativa III estiver correta."],["d","se somente as afirmativas I e II estiverem corretas."],["e","se todas as afirmativas estiverem corretas."]],g:"e"},
{n:81,f:"Questões Pop Prof RIna/200144 - FGV - PM MA/2012",t:`O censo de 2010, realizado pelo IBGE, evidenciou que a população total do Maranhão, aproximadamente 6.574.789 habitantes, representava cerca de 3,5% da população brasileira.

Em relação à população do Maranhão, analise as afirmativas a seguir.

I. O Maranhão apresenta o menor índice de urbanização dentre os estados brasileiros.
II. A cidade de São Luís ultrapassou a marca de um milhão de habitantes.
III. A população do Maranhão representa mais de 30% da população da Região Nordeste.

Assinale:`,op:[["a","se somente a afirmativa I estiver correta."],["b","se somente a afirmativa II estiver correta."],["c","se somente a afirmativa III estiver correta."],["d","se somente as afirmativas I e II estiverem corretas."],["e","se todas as afirmativas estiverem corretas."]],g:"d"},
{n:82,f:"Questões Pop Prof RIna/200146 - FGV - CBM MA/2012",t:`O extrativismo vegetal é uma atividade tradicional do Estado do Maranhão. Dentre os produtos do extrativismo o que mais se destaca é o babaçu. As amêndoas dessa palmeira são transformadas em óleo ou azeite, utilizados no preparo de alimentos, na produção de sabão ou cosméticos e como combustível.

Sobre o extrativismo do babaçu no Maranhão, assinale a afirmativa correta.`,op:[["a","A palmeira babaçu só é encontrada no Estado do Maranhão."],["b","A extração do babaçu envolve, atualmente, um alto grau de mecanização."],["c","A legislação não garante o acesso aos babaçuais e a proteção das palmeiras de babaçu."],["d","A Reserva Extrativista Quilombo do Frexal está situada em uma área de grande concentração de palmeiras de babaçu."],["e",`A atividade extrativa de babaçu é realizada por homens que se autodenominam "quebradores de coco".`]],g:"d"},
{n:83,f:"Questões Pop Prof RIna/1108645 - FCC - SM PM MA/2006",t:`São Luís, capital do Maranhão, foi elevada pelo IBGE à condição de metrópole emergente. Uma das condições necessárias para essa classificação é`,op:[["a","ter uma densidade demográfica igual ou superior a 60 hab./km²."],["b","possuir mais de 50% da população ativa empregada na indústria."],["c","polarizar uma região com extensão superior a 500 mil km²."],["d","apresentar uma conurbação com pelo menos 10 municípios."],["e","contar com mais de 200 anos de fundação."]],g:"a"},

const DADOS = {historia: HISTORIA, geografia: GEOGRAFIA};
const respostas = {historia:{}, geografia:{}};
let abaAtual = "historia";

function mudarAba(aba){
  abaAtual = aba;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab===aba));
  renderizar();
}

function escolherAlternativa(aba, idx, letra){
  if(respostas[aba][idx]) return;
  respostas[aba][idx] = letra;
  renderizar();
}

function reiniciar(){
  respostas[abaAtual] = {};
  renderizar();
}

function renderizar(){
  const lista = DADOS[abaAtual];
  const main = document.getElementById("main");
  main.innerHTML = "";

  lista.forEach(q=>{
    const div = document.createElement("div");
    div.className = "question";

    const head = document.createElement("div");
    head.className = "q-head";
    head.innerHTML = `<span class="q-num">Questão ${q.n}</span><span class="q-source">${q.f}</span>`;
    div.appendChild(head);

    const texto = document.createElement("div");
    texto.className = "q-text";
    texto.textContent = q.t;
    div.appendChild(texto);

    const respostaAtual = respostas[abaAtual][q.n];

    if(q.op){
      const alts = document.createElement("div");
      alts.className = "alts";
      q.op.forEach(([letra,txt])=>{
        const btn = document.createElement("button");
        btn.className = "alt-btn";
        btn.innerHTML = `<b>${letra.toUpperCase()})</b> ${txt}`;
        if(respostaAtual){
          btn.classList.add("disabled");
          if(letra===q.g) btn.classList.add("correct");
          else if(letra===respostaAtual) btn.classList.add("wrong");
        } else {
          btn.onclick = ()=>escolherAlternativa(abaAtual, q.n, letra);
        }
        alts.appendChild(btn);
      });
      div.appendChild(alts);
    } else {
      const row = document.createElement("div");
      row.className = "ce-row";
      ["certo","errado"].forEach(op=>{
        const btn = document.createElement("button");
        btn.className = "ce-btn";
        btn.textContent = op==="certo" ? "✅ CERTO" : "❌ ERRADO";
        if(respostaAtual){
          btn.classList.add("disabled");
          if(op===q.g) btn.classList.add("correct");
          else if(op===respostaAtual) btn.classList.add("wrong");
        } else {
          btn.onclick = ()=>escolherAlternativa(abaAtual, q.n, op);
        }
        row.appendChild(btn);
      });
      div.appendChild(row);
    }

    if(respostaAtual){
      const fb = document.createElement("div");
      const acertou = respostaAtual === q.g;
      fb.className = "feedback " + (acertou ? "ok" : "bad");
      fb.textContent = acertou
        ? "✔ Você acertou! Gabarito: " + q.g.toUpperCase()
        : "✘ Você errou. Gabarito: " + q.g.toUpperCase();
      div.appendChild(fb);
    }

    main.appendChild(div);
  });

  atualizarPlacar();
}

function atualizarPlacar(){
  const lista = DADOS[abaAtual];
  const total = lista.length;
  const resp = Object.keys(respostas[abaAtual]).length;
  let ok=0, bad=0;
  lista.forEach(q=>{
    const r = respostas[abaAtual][q.n];
    if(r){ if(r===q.g) ok++; else bad++; }
  });
  document.getElementById("sc-total").textContent = total;
  document.getElementById("sc-resp").textContent = resp;
  document.getElementById("sc-ok").textContent = ok;
  document.getElementById("sc-bad").textContent = bad;
}

renderizar();
</script>
