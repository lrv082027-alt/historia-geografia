<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulado História e Geografia do Maranhão - PM MA 2026</title>
<style>
  :root{
    --navy:#0b1930;
    --navy2:#132644;
    --gold:#f2b705;
    --gold2:#ffd23f;
    --red:#c8102e;
    --green:#1e8e5a;
    --wrong:#c62828;
    --card:#ffffff;
    --text:#152238;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:linear-gradient(180deg,#081222,#0b1930 40%,#132644);
    color:#eef2f8;
    min-height:100vh;
  }
  header{
    padding:22px 16px 16px;
    text-align:center;
    border-bottom:4px solid var(--gold);
    background:radial-gradient(circle at 50% -50%, #1a3560, #081222 70%);
  }
  header h1{
    margin:0 0 6px;
    font-size:1.5rem;
    color:var(--gold2);
    letter-spacing:.5px;
  }
  header p{margin:0;color:#c9d6ea;font-size:.9rem;}

  .tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:16px auto 0;
    max-width:600px;
    flex-wrap:wrap;
  }
  .tab-btn{
    flex:1;
    min-width:140px;
    padding:10px 14px;
    background:var(--navy2);
    border:2px solid var(--gold);
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    font-size:.95rem;
    transition:.15s;
  }
  .tab-btn.active{
    background:var(--gold);
    color:var(--navy);
  }
  .tab-btn:hover{filter:brightness(1.1);}

  .scoreboard{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(8,18,34,.96);
    backdrop-filter:blur(4px);
    border-bottom:2px solid var(--gold);
    padding:10px 14px;
    display:flex;
    flex-wrap:wrap;
    gap:10px 18px;
    justify-content:center;
    align-items:center;
    font-size:.85rem;
  }
  .scoreboard b{color:var(--gold2);}
  .scoreboard .ok{color:#7CFC9A;font-weight:700;}
  .scoreboard .bad{color:#ff8a8a;font-weight:700;}
  .reset-btn{
    background:var(--red);
    color:#fff;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    font-size:.8rem;
    cursor:pointer;
    font-weight:600;
  }
  .reset-btn:hover{filter:brightness(1.15);}

  main{
    max-width:820px;
    margin:0 auto;
    padding:18px 12px 60px;
  }

  .question{
    background:var(--card);
    color:var(--text);
    border-radius:12px;
    padding:16px 16px 14px;
    margin-bottom:16px;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    border-left:6px solid var(--gold);
  }
  .q-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .q-num{
    font-weight:800;
    color:var(--navy2);
    font-size:1rem;
  }
  .q-source{
    font-size:.72rem;
    color:#6b7688;
    font-style:italic;
    text-align:right;
    flex:1;
  }
  .q-text{
    white-space:pre-wrap;
    line-height:1.5;
    font-size:.95rem;
    margin-bottom:12px;
  }
  .q-text .fonte{
    display:block;
    font-size:.82rem;
    font-style:italic;
    color:#4a5568;
    margin:6px 0;
  }

  .alts{display:flex;flex-direction:column;gap:8px;}
  .alt-btn{
    text-align:left;
    padding:9px 12px;
    border:2px solid #d7dce4;
    background:#f7f9fc;
    border-radius:8px;
    cursor:pointer;
    font-size:.92rem;
    color:var(--text);
    line-height:1.35;
  }
  .alt-btn:hover:not(.disabled){
    border-color:var(--gold);
    background:#fff7e0;
  }
  .alt-btn b{margin-right:6px;color:var(--navy2);}
  .alt-btn.correct{
    background:#e3f7ec;
    border-color:var(--green);
    color:#0d5c39;
    font-weight:700;
  }
  .alt-btn.wrong{
    background:#fdeceb;
    border-color:var(--wrong);
    color:#8f1e17;
    font-weight:700;
  }
  .alt-btn.disabled{cursor:default;opacity:.85;}

  .ce-row{display:flex;gap:10px;}
  .ce-btn{
    flex:1;
    padding:11px;
    border:2px solid #d7dce4;
    background:#f7f9fc;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
    font-size:.95rem;
    color:var(--text);
  }
  .ce-btn:hover:not(.disabled){border-color:var(--gold);background:#fff7e0;}
  .ce-btn.correct{background:#e3f7ec;border-color:var(--green);color:#0d5c39;}
  .ce-btn.wrong{background:#fdeceb;border-color:var(--wrong);color:#8f1e17;}
  .ce-btn.disabled{cursor:default;opacity:.85;}

  .feedback{
    margin-top:10px;
    font-size:.85rem;
    font-weight:700;
    padding:8px 10px;
    border-radius:6px;
  }
  .feedback.ok{background:#e3f7ec;color:#0d5c39;}
  .feedback.bad{background:#fdeceb;color:#8f1e17;}

  footer{
    text-align:center;
    padding:20px;
    color:#8fa0bd;
    font-size:.78rem;
  }
</style>
</head>

<header>
  <h1>🎯 Simulado PM MA 2026</h1>
  <p>História do Maranhão (37 questões) + Geografia do Maranhão (74 questões)</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="historia" onclick="mudarAba('historia')">📜 História (37)</button>

<div class="scoreboard">

<main id="main"></main>

<footer>Bons estudos! Fé, foco e aprovação. 🚔</footer>

<script>
/* ============ DADOS ============ */

const HISTORIA = [
{n:1,f:"Questões POP Prof Rina/3452005 - AOCP - Prof (Pref São Luís)/2025",t:`O patrimônio cultural de São Luís (MA) inclui uma rica produção de poemas e romances de renomados escritores, entre eles, estão`,op:[["a","Aluísio de Azevedo e Graça Aranha."],["b","Érico Veríssimo e Ana Maria Machado."],["c","Carlos Drummond de Andrade e Mario Quintana."],["d","Clarice Lispector e Manuel Bandeira."],["e","José de Alencar e Rachel de Queiroz."]],g:"a"},
{n:2,f:"Questões POP Prof Rina/1646862 - FCC - TRT11/2024",t:`No século XVII a Coroa portuguesa institui um modelo administrativo colonial, no Brasil,`,op:[["a",`que nomeava, para cada província, ouvidores encarregados da administração, auxiliados pelos chamados "juízes de fora" que eram representantes da Coroa responsáveis pelo cumprimento da lei.`],["b","segundo o qual a região Norte, até o limite imposto pelo Tratado de Tordesilhas, foi governada durante todo esse período pela Capitania Hereditária do Maranhão."],["c","estruturado em um Governo-Geral que foi subdividido em dois governos: a Repartição do Norte e a do Sul, divisão que perdurou pouco tempo."],["d","que vinculada a atual região Norte a uma região administrativa autônoma, inicialmente denominada Estado do Maranhão, tendo São Luís como sua capital."],["e","baseado na concepção de vice-reino adotada também pela Espanha em suas colônias, que perdurou até a vinda da família real portuguesa."]],g:"d"},
{n:3,f:"Questões POP Prof Rina/3029053 - Instituto Consulplan - TJ MA/2024",t:`"Possuidor de uma das menores rendas fiscais do país, faltava ao Maranhão um produto para o qual o setor econômico voltasse os olhos, como o algodão que outrora dera considerável impulso na economia maranhense. [...] basta lembrar aqui que aquela, nossa capital, que fora das primeiras cidades, em todo o país, a servir-se de iluminação a gás e de transporte urbano a tração animal, seria das últimas, dentre as nossas metrópoles estaduais e cidades maiores, a poder substituir esses serviços de utilidade pública, quando caíram em desuso, pelos de iluminação e tração elétricas."
(MEIRELES, Mário Martins. História do Maranhão. 2 ed. São Luís: Fundação Cultural do Maranhão, 1980.)

A modernização no Maranhão a partir do contexto anteriormente citado tem como sua mola propulsora:`,op:[["a","A cultura do café, que chegou a disputar com pequena margem de diferença, com a produção do oeste paulista."],["b","A revitalização das plantações de drogas do sertão, durante todo o tempo, o sustentáculo da economia do estado."],["c","O plantio e o beneficiamento da seringueira, aproveitando o surto industrial de substituição das importações pelo qual passava o país."],["d","Instalação de fábricas, sobretudo têxteis ou de fiação que chamaram a atenção da população do interior do estado para a capital (São Luís)."]],g:"d"},
{n:4,f:"Questões POP Prof Rina/2514224 - SUCONS UEMA - PSS UEMA 60+/2023",t:`Analise a imagem a seguir.
[Foto: manifestação estudantil em São Luís com cartazes, 1979 - Agência Tambor]

Em setembro de 1979, eclodiu na cidade de São Luís, capital do Estado do Maranhão, uma manifestação social que ficou conhecida como a Greve da Meia Passagem. Sobre essa revolta que abalou a cidade é correto afirmar que foi`,op:[["a","engendrada por um contexto de convulsão social e de retorno da legalidade do movimento estudantil, resultando na vitória dos estudantes."],["b","recebida com surpresa e condescendência pelo poder público, abrindo um canal de negociação para atender às reivindicações dos discentes."],["c","causada pela revolta e pela luta armada dos alunos por seus direitos, conseguindo obter sucesso no direito à meia passagem dos estudantes."],["d","motivada pela mobilização dos estudantes de São Luís e pelo apoio dos empresários da cidade em 1979, obtendo o êxito das propostas estudantis."],["e","ocasionada por um período de forte repressão nas universidades com a Lei da Anistia, desembocando em vários confrontos no êxito dos discentes."]],g:"a"},
{n:5,f:"Questões POP Prof Rina/2639321 - IGEDUC - Prof (Tupanatinga)/2023",t:`É correto afirmar que, no início do século XVII, a França faria sua segunda tentativa de colonização no Maranhão, que a colonização portuguesa ainda não tinha atingido. Essa França Equinoxial é bem menos conhecida do que a tentativa anterior, embora tivesse um caráter mais oficial, na medida em que era apoiada diretamente pela Coroa e tenha constituído, naquele momento, o esforço colonial mais importante da França, que após sua derrota voltaria finalmente suas atenções para o norte do continente, para cuidar, depois de um século de quase total abandono, do estabelecimento de uma Nova França no Canadá.`,g:"certo"},
{n:6,f:"Questões POP Prof Rina/2894010 - LJ Assessoria - Pref SA dos Lopes/2023",t:`Ainda sobre os conhecimentos históricos, geográficos e sociais do Município de Santo Antônio dos Lopes, é correto afirmar que suas terras são do tipo massapé, isso quer dizer que:`,op:[["a","Tem rio."],["b",`Não tem rio, mas os povoados "Marimbondo" e "Insono" são banhados pelo Rio Mearim.`],["c",`Não tem rio, mas os povoados "Pacas" e "Marianópolis" são banhados pelo Rio Poti. Os demais, são servidos de açudes, poços artesianos e igarapés temporários, sendo os mais importantes "marimbondo" e "Insono".`],["d",`Não tem rio, mas os povoados "Pacas" e "Marianópolis" são banhados pelo Rio Mearim. Os demais, são servidos de açudes, poços artesianos e igarapés temporários, sendo os mais importantes "marimbondo" e "Insono".`],["e",`Tem rio, mas os povoados "Pacas" e "Marianópolis" são banhados pelo Rio Mearim. Os demais, são servidos de açudes, poços artesianos e igarapés temporários, sendo os mais importantes "Longá" e "Parnaíba".`]],g:"d"},
{n:7,f:"Questões POP Prof Rina/2506900 - SUCONS UEMA - EAD/2022",t:`O mito da Atenas Brasileira foi incorporado pela elite do século XIX, a partir da existência de uma classe dominante abastada, proprietária de estabelecimentos comerciais, escravos, terras e agroexportação de algodão, açúcar, além das fábricas. Foi essa opulência econômico-comercial, respaldada na exportação de produtos, sobretudo agrícolas, que norteou a convicção de "sociedade de letrados", que predominou, na província, ao longo do século XIX.
(BOTELHO, Joan. Conhecendo e debatendo a História do Maranhão. 3.ed. São Luís: Gráfica e Editora Impacto, 2019.)

A que se refere esse imaginário que produziu uma construção identitária da cidade de São Luís como a Atenas Brasileira?`,op:[["a","Ao conjunto de intelectuais ligado à cultura das letras, responsável por destacar a excepcionalidade da cultura regional."],["b","Aos literatos que saíram de São Luís, tornando conhecida a literatura local no quadro das letras nacionais."],["c","Ao grupo de notáveis escritores que estudou nos grandes centros europeus, formando uma elite cultural."],["d","A uma elite local de hábitos e de costumes europeus, representante de um grupo social distinto economicamente."],["e","Aos intelectuais oriundos de famílias menos abastadas, constituindo uma elite que ascendeu socialmente pelo talento das letras."]],g:"a"},
{n:8,f:"Questões POP Prof Rina/2506908 - SUCONS UEMA - EAD/2022",t:`Leia o texto publicado pela Revista Continente.

Caminhar pela Rua Portugal, [...], descer e subir as escadarias de pedras que ligam centenários becos e ladeiras, ou simplesmente parar para apreciar o gigante braço de mar que parece envolver a cidade são programas obrigatórios para quem chega a São Luís, uma das três capitais brasileiras construídas em ilhas e bem na porta de entrada para a Amazônia. Fundada por franceses, invadida por holandeses e colonizada por portugueses, a capital do Maranhão revela um preservado conjunto de influências que resiste ao tempo e que pode ser conferido nas centenas de prédios e monumentos encontrados no centro histórico. Reconhecida pela Unesco como Patrimônio da Humanidade, [...] ao lado do patrimônio material, presente nos casarões e prédios religiosos, São Luís também é marcante em suas manifestações populares. A miscigenação racial (brancos, negros e índios) está na origem da brincadeira mais presente na cidade, o bumba meu boi. Embora ocorra em outras regiões do Brasil, com semelhante conformação étnica, apenas no Maranhão a festa possui [...] "sotaques" diferentes. As distinções aparecem nos instrumentos, na indumentária e nas formas de expressão.

O revestimento dos casarões da rua Portugal, no centro histórico de São Luís, de Alcântara e de Viana e uma outra manifestação cultural expressiva maranhense são`,op:[["a","a marchetaria e o cacuriá."],["b","as pedras de cantaria e o rodeio."],["c","o mosaico e a catira."],["d","os azulejos e o tambor de crioula."],["e","a argamassa e o bumba meu boi."]],g:"d"},
{n:9,f:"Questões POP Prof Rina/2514384 - SUCONS UEMA - PSS UEMA 60+/2022",t:`A Balaiada foi a maior revolta rural do Maranhão, ocorrida entre dezembro de 1838 e fevereiro de 1841, caracterizando-se por ser uma luta protagonizada por homens e por mulheres do povo.

Leia o trecho a seguir.
Oficialmente, a Balaiada iniciou-se no lugar denominado Vila da Manga do Iguará (hoje município de Nina Rodrigues), próximo à Vargem Grande, quando o vaqueiro Raimundo Gomes invadiu o cárcere da vila, proclamando a soltura de todos os indivíduos que estavam presos. Esse foi, apenas, o estopim de um movimento que se expandiu por quase todo o interior da província, alcançando, inclusive, as terras do Piauí.
(BOTELHO, Joan. Conhecendo e Debatendo a História do Maranhão. 3.ed. São Luís: gráfica e Editora Impacto, 2019, p. 165.)

O episódio que representa o ápice desse movimento foi`,op:[["a","o cerco da capital São Luís, com a organização de um Conselho de guerra, formado por balaios e por políticos liberais."],["b","a tomada da cidade de Caxias no sertão maranhense, com a instalação de uma Junta Governativa."],["c","a ocupação da região de Pastos Bons, com a organização de um governo separatista no sul da Província."],["d","a chegada dos balaios ao poder no governo provincial, com a prisão do presidente da Província."],["e","a rendição das principais autoridades políticas da Província, com a emissão de decretos para a expulsão dos portugueses."]],g:"b"},
{n:25,f:"Questões POP Prof Rina/1008558 - FCC - TJ MA/2019",t:`Considere as afirmações a seguir sobre a Companhia de Comércio do Maranhão e Grão-Pará, criada em 1755.

I. Possuía o monopólio do comércio de escravos e o transporte naval de mercadorias para estas regiões.
II. Enfrentou forte resistência da Companhia de Jesus, que explorava comercialmente a região amazônica.
III. Criada pelos ingleses para controlar o comércio interno da Região Amazônica, a Companhia obteve amplo apoio dos comerciantes locais que puderam ter acesso a novas mercadorias.
IV. Foi criada no contexto das reformas administrativas e políticas do Império Português sob o comando do Marquês de Pombal, a fim de desenvolver economicamente a região.

Está correto o que se afirma APENAS em`,op:[["a","I e III."],["b","II e IV."],["c","I, III e IV."],["d","II e III."],["e","I, II e IV."]],g:"e"},
{n:26,f:"Questões POP Prof Rina/1008559 - FCC - TJ MA/2019",t:`A Batalha do Jenipapo e o Cerco de Caxias são episódios que impactaram a história do Maranhão e se situam na conjuntura da`,op:[["a","Guerra de Independência ocorrida no Meio-Norte da América Portuguesa, território que não aderiu prontamente ao Império do Brasil, dada a forte presença militar e comercial portuguesa na região."],["b","Balaiada, caracterizada como uma revolta republicana que contou com a adesão de diversos setores sociais, contra o Império do Brasil, então dominado pela Casa de Bragança e pela Corte Portuguesa."],["c","Cabanagem, movimento de amplas dimensões que se originou no Grão-Pará e alcançou o Maranhão, marcado por grande participação popular, incluindo indígenas, quilombolas e escravos."],["d","Revolta de Bequimão, desencadeada pela reação de fazendeiros e donos de engenho contra o monopólio das companhias de comércio portuguesas."],["e","Guerra de combate à Invasão Holandesa, que resultou na vitória das forças nativistas luso-brasileiras após a expulsão das tropas de Maurício de Nassau."]],g:"a"},
{n:27,f:"Questões POP Prof Rina/1008560 - FCC - TJ MA/2019",t:`Entre as consequências do governo de Miguel dos Santos Freire e Bruce (1823-1824), que se seguiu à adesão oficial do Maranhão ao Império do Brasil, destaca-se`,op:[["a","o desencadeamento da repressão às classes populares que queriam continuar fiéis a Portugal, ao contrário das elites comerciantes luso-brasileiras e donos de latifúndios, partidários da adesão ao Império do Brasil."],["b","a divisão da sociedade entre monarquistas e republicanos e a adesão formal do Maranhão à Confederação do Equador, que visava separar politicamente o Norte do Império do Brasil, constituindo uma República independente."],["c",`a abolição da escravidão na Província, causando a ruptura das elites escravocratas com o chamado "brucismo", que apoiava a emancipação dos escravos e a reforma agrária como forma de modernizar a região.`],["d","o estabelecimento de um pacto de união entre portugueses comerciantes e brasileiros latifundiários, articulado pelo governo da Província, para excluir as classes populares da cena política."],["e","o acirramento das tensões sociais e políticas na Província, em função do medo e da insatisfação das elites diante da postura antilusitana desse governo e sua condescendência com manifestações populares contra proprietários portugueses."]],g:"e"},
{n:28,f:"Questões POP Prof Rina/1009547 - FCC - TJ MA/2019",t:`Após a adesão do Maranhão à República, proclamada em 1889, ocorreu`,op:[["a","a eclosão de uma sangrenta Guerra Civil, entre 1889 e 1891, que opôs federalistas e liberais que disputavam como seria o novo regime e como o Estado iria se relacionar com o poder central."],["b","a destituição do governo nomeado pelo Partido Republicano, que contava com grande apoio das elites locais, mas foi substituído por uma Junta Militar monarquista, comandada pelo coronel João Luis Tavares."],["c","uma revolta popular contra o novo governo republicano, dado o grande apoio que a monarquia e a Princesa Isabel tinham por parte de setores da imprensa abolicionista e da população negra, maioria absoluta no Estado."],["d",`um conflito entre o governo de Pedro Augusto Tavares Júnior e a Igreja Católica, pois o primeiro decretou a liberdade de culto e separou a Igreja e o Estado, demitindo padres de funções públicas, sendo pressionado pelo governo central da República a voltar atrás nestes decretos.`],["e","a intervenção no Estado por parte do governo central, em apoio à política republicana radical de reformas econômicas populares, combatidas pelas elites fundiárias tradicionais e pelo clero."]],g:"d"},
{n:29,f:"Questões POP Prof Rina/1009549 - FCC - TJ MA/2019",t:`Dentre as manifestações da cultura maranhense, destacam-se algumas reconhecidas como patrimônio imaterial do Maranhão pelo IPHAN (Instituto do Patrimônio Histórico e Artístico Nacional):`,op:[["a","as Rodas de Capoeira e o Cavalo Marinho."],["b","o Tambor de Crioula e o Bumba meu Boi."],["c","a Renda de Bilros e o Tambor de Mina."],["d","a Marujada e o Maculelê."],["e","a Festa Junina e a Cavalhada."]],g:"b"},
{n:30,f:"Questões POP Prof Rina/589439 - CEBRASPE - 1º Ten PM MA/2018",t:`No que diz respeito à história do Maranhão nos períodos colonial e imperial, julgue o item subsequente.

A Balaiada, que sofreu violenta repressão comandada pelo coronel do Exército Luiz Alves de Lima, foi um movimento de composição social complexo, pois agregou artesãos, escravos, libertos e pequenos proprietários das províncias do Maranhão e Piauí contrários à opressão dos governos locais.`,g:"errado"},
{n:31,f:"Questões POP Prof Rina/589442 - CEBRASPE - 1º Ten PM MA/2018",t:`Acerca da história do Maranhão no período republicano, julgue o item.

Após a conturbada adesão do Maranhão à República, a ordem foi estabelecida a partir da ação das lideranças que já atuavam na política maranhense desde meados do século XIX.`,g:"errado"},
{n:32,f:"Questões POP Prof Rina/589443 - CEBRASPE - 1º Ten PM MA/2018",t:`Acerca da história do Maranhão no período republicano, julgue o item.

José Maria dos Reis Perdigão e Tarquínio Lopes Filho foram grandes lideranças dos tarquinistas — grupo maranhense que apoiou o tenentismo e a Revolução de 1930.`,g:"certo"},
{n:33,f:"Questões POP Prof Rina/589962 - CEBRASPE - SM PM MA/2018",t:`O século XVI marcou o início da colonização do território brasileiro pelos portugueses, mas as terras descobertas ao sul do continente americano e conquistadas por Portugal e Espanha foram, à época, cobiçadas por outros povos europeus como os franceses, ingleses e holandeses, que chegaram a ocupar os domínios portugueses e espanhóis no Novo Mundo. Em meio a essa disputa, ampliada quando Portugal foi incorporado pela Espanha na denominada União Ibérica (1580–1640), situa-se parte significativa da história do Maranhão no período colonial.

Considerando o contexto histórico apresentado, julgue o item relativo à história do Maranhão no período colonial.

No século XVII, o Maranhão foi local de conflito entre os colonos, que não aceitavam escravizar indígenas, e os jesuítas, que impediam a escravidão africana na região.`,g:"errado"},
{n:34,f:"Questões POP Prof Rina/589963 - CEBRASPE - SM PM MA/2018",t:`(Mesmo contexto da questão anterior sobre o período colonial maranhense.)

A revolta liderada pelo senhor de engenho Manuel Beckman foi vitoriosa: coroado rei, Beckman governou o Maranhão por muitos anos até ser condenado e enforcado pelo Tribunal do Santo Ofício, fato que resultou na reintegração da região ao Estado do Brasil.`,g:"errado"},
{n:35,f:"Questões POP Prof Rina/589966 - CEBRASPE - SM PM MA/2018",t:`(Mesmo contexto sobre o período colonial maranhense.)

A construção do Forte de São Luís, localizado em uma ilha da baía de São Marcos, resultou da ação do francês Daniel de La Touche, senhor de La Ravardière.`,g:"certo"},
{n:36,f:"Questões POP Prof Rina/589967 - CEBRASPE - SM PM MA/2018",t:`(Mesmo contexto sobre o período colonial maranhense.)

A resistência francesa em defesa da França Equinocial, sob o comando de La Ravardière, impediu a conquista portuguesa do território do Maranhão, fato concretizado às vésperas da Independência do Brasil.`,g:"errado"},
{n:37,f:"Questões POP Prof Rina/589970 - CEBRASPE - SM PM MA/2018",t:`Nas primeiras décadas após a Independência, o Brasil viveu verdadeira guerra civil. O Maranhão integrou esse quadro conflituoso, em que avulta a Balaiada (1838–1841), e que também envolveu o Piauí e parte do Ceará. Acerca desse assunto, julgue o item.

Ao negar-se a enfrentar os balaios, Luís Alves de Lima e Silva, o futuro Duque de Caxias, recusou-se, pela primeira e única vez, a cumprir uma ordem do governo central.`,g:"errado"},
{n:38,f:"Questões POP Prof Rina/589971 - CEBRASPE - SM PM MA/2018",t:`(Mesmo contexto sobre a Balaiada.)

À época da Balaiada, a economia maranhense estava assentada na agroindústria açucareira, pois as culturas de algodão e arroz haviam fracassado por completo.`,g:"errado"},
{n:39,f:"Questões POP Prof Rina/589972 - CEBRASPE - SM PM MA/2018",t:`(Mesmo contexto sobre a Balaiada.)

A classe camponesa maranhense, no contexto das Regências, formou-se a partir de três matrizes: indígenas aldeados, escravos alforriados ou quilombolas e emigrantes do sertão cearense.`,g:"certo"},
{n:40,f:"Questões POP Prof Rina/448804 - CEBRASPE - Prof (Pref São Luís)/2017",t:`A batalha de Guaxentuba inscreve-se entre os embates ocorridos no litoral do Maranhão colonial (século XVII), com reflexos na própria colonização do Brasil por Portugal. Essa batalha assinalou`,op:[["a","a vitória definitiva dos portugueses sobre os franceses pela posse da costa norte do Brasil."],["b","a histórica decisão de Jerônimo de Albuquerque de render-se a La Ravardière para preservar a vida de seus combatentes."],["c","o fim das incursões de países europeus sobre o território americano colonizado por Portugal."],["d","o extermínio dos povos indígenas que, vindos de Pernambuco, ocuparam o litoral maranhense."],["e","a inferioridade bélica francesa, agravada pela inexistência de qualquer aliança com índios da região."]],g:"a"},
{n:41,f:"Questões POP Prof Rina/448811 - CEBRASPE - Prof (Pref São Luís)/2017",t:`A respeito da Companhia Geral de Comércio do Grão-Pará e Maranhão, assinale a opção correta.`,op:[["a","A companhia, que detinha o monopólio do comércio de diversas mercadorias com o objetivo de evitar o contrabando e sonegação de impostos, submetia-se ao poder do Estado do Grão-Pará e Maranhão."],["b","A criação da companhia ocorreu no contexto de autonomia do Estado do Grão-Pará e Maranhão, em relação ao Brasil, que permitia que o estado tivesse, inclusive, governador próprio."],["c","As atividades da companhia não incluíram o comércio de escravos, já que era mais comum, na região, o uso da mão-de-obra indígena."],["d","Com o desmembramento do Estado do Grão-Pará e Maranhão a companhia também foi extinta, o que resultou em uma súbita redução nas exportações do Maranhão e do Pará."],["e","A companhia, apesar de deter o monopólio das exportações, atuou em consonância com os interesses dos produtores locais."]],g:"b"},
{n:42,f:"Questões POP Prof Rina/2480098 - FSADU UFMA - IF MA/2015",t:`"As províncias do norte são a Costa d'África do Sul. A avidez do ganho cega os homens, e, ante o lucro, abafam-se todos os sentimentos generosos e o homem que teve a infelicidade de ser escravo é vendido por outro homem, mais feliz do que ele, para fora de sua terra, do lugar onde foi criado, arrancando-o à família, aos parentes, a todas as afeições como se fosse uma besta de carga!". Esse relato, extraído do jornal Diário do Maranhão, de 12 de maio de 1874, refere-se ao tráfico interprovincial de escravos que foi utilizado como uma alternativa para atender à demanda de mão de obra para a região cafeeira após a proibição do tráfico transatlântico de escravos, em 1850. Sobre essa questão, pode-se afirmar:`,op:[["a","Os escravos deslocados pelo tráfico interprovincial eram utilizados exclusivamente nas atividades domésticas e no ganho, uma vez que a mão de obra escrava foi substituída nas atividades agrícolas pelos imigrantes estrangeiros."],["b","Os lamentos nos portos tornaram-se comuns, assim como as denúncias de maus-tratos nos tumbeiros que faziam os deslocamentos dos escravos das regiões econômicas em crise para o Sudeste."],["c","O tráfico interprovincial de escravos tornou-se uma importante atividade econômica no Maranhão uma vez que a cidade de São Luís passou a funcionar como um entreposto desse comércio ficando responsável pelo deslocamento dos escravos das províncias do Ceará e do Pará para o Rio de Janeiro."],["d","Essa atividade só cessou quando as províncias do Nordeste a impediram com altos impostos, ao sentirem que, a escravidão como instituição, estava ameaçada já que tal comércio havia produzido um desequilíbrio na distribuição dos contingentes escravos no país."],["e","O tráfico interprovincial de escravos foi intenso no Maranhão a partir do ano de 1846 e teve um papel relevante no processo de rompimento dos laços familiares e afetivos dos sujeitos escravizados, além de contribuir para a desarticulação do sistema escravista na província."]],g:"e"},
{n:43,f:"Questões POP Prof Rina/2480131 - FSADU UFMA - IF MA/2015",t:`"Na hora que eu botava carga lá na Praia Grande, trazia depois de canoa para cá. Aí quando chegava aqui tirava da canoa e botava em carroças. Iche! Era difícil, era ombro mesmo, trazer uma peça de lá para cá. As casa aqui era de taipa porque era difícil da gente trazer tijolo, telha, essas coisas (material de construção). Depois que a ponte passou não, aí foi outra coisa. Mas antes ninguém esperava que ia ter uma explosão, a gente pensava que isso era da gente (Joaquim)". (BARROS, Valdenira. Imagens do Moderno em São Luís. São Luís, 2001, p. 56). Esse relato refere-se à construção da ponte São Francisco (oficialmente batizada como ponte José Sarney), em São Luís, inaugurada em 14 de fevereiro de 1970. Sobre essa questão, pode-se afirmar:`,op:[["a","A obra levou a várias manifestações, principalmente dos barqueiros e pescadores que ganhavam a vida fazendo o transporte de pessoas e mercadorias e das populações que foram deslocadas para sua construção. Tais atos contribuíram de forma significativa para o atraso das obras, visto que sua conclusão estava prevista para marcar as comemorações do primeiro ano de mandato do governador José Sarney."],["b","A construção da ponte levou ao deslocamento das classes alta e média para a região das praias e do bairro do São Francisco, liberando os antigos casarões que foram transformados, de imediato, em repartições públicas, o que possibilitou a preservação desse patrimônio arquitetônico."],["c",`O projeto de edificação da ponte era uma entre muitas ações planejadas pelo governador José Sarney com o intuito de transformar São Luís em uma capital condizente com "O Maranhão Novo". Essas ideias estavam contidas no "Plano Rodoviário da Ilha de São Luís" formulado em seu governo.`],["d","A retirada das famílias que, originariamente, ocupavam a região do São Francisco criou um espaço específico, habitado apenas pela classe média, com prédios modernos, restaurantes e hotéis que fizeram com que a ponte interligasse duas cidades distintas: a velha São Luís, com uma arquitetura antiga e ocupação social homogênea, e a nova São Luís, moderna e rica."],["e","A construção da ponte levou ao deslocamento de parte das populações que habitavam essa região dando lugar a moradias de classe média e a prédios comerciais. Mais do que a interligação de espaços, a ponte significou a passagem para um novo tempo, para uma São Luís do futuro, concepção que se articulava com a ideia de Maranhão Novo, slogan do então governador José Sarney."]],g:"e"},
{n:44,f:"Questões POP Prof Rina/200147 - FGV - CBM MA/2012",t:`"O Maranhão passou a ser o primeiro estado brasileiro em número de conflitos agrários. Essa é a constatação da Comissão Pastoral da Terra (CPT), que (...) divulgou oficialmente no estado o seu 27º relatório anual sobre o tema. De acordo com a CPT, no ano passado, no Maranhão, foram registrados 251 casos de conflitos por terra, envolvendo 64.394 pessoas." (g1.globo.com)

Com relação às raízes históricas da violência no campo no Estado do Maranhão, analise as afirmativas a seguir.

I. No início da década de 1970, com o intuito de estimular a ocupação da região, o governo do Maranhão criou a Companhia Maranhense de Colonização (COMARCO), concedendo incentivos fiscais a grandes grupos empresariais, para a aquisição de vastas extensões territoriais a preços simbólicos, o que intensificou os conflitos de terra e a violência no campo.
II. Para viabilizar a implantação do Centro de Lançamento de Alcântara (CLA), o governo maranhense assinou, a favor da União, o decreto de desapropriação de terras ocupadas por comunidades quilombolas, gerando conflitos fundiários que continuam, ainda hoje, em disputa judicial.
III. Com o avanço do agronegócio na primeira década do século XXI, criou-se uma nova fronteira agrícola na região de MAPITOBA (parte do Maranhão, Piauí, Tocantins e Bahia), o que valorizou a terra e aumentou os conflitos com os posseiros tradicionais.

Assinale:`,op:[["a","se somente a afirmativa I estiver correta."],["b","se somente a afirmativa II estiver correta."],["c","se somente a afirmativa III estiver correta."],["d","se somente as afirmativas I e II estiverem corretas."],["e","se todas as afirmativas estiverem corretas."]],g:"e"},
{n:45,f:"Questões POP Prof Rina/2055726 - CESGRANRIO - SEEC RN/2011",t:`Durante os mais de trezentos anos de colonização, a América Portuguesa passou por diversas alterações em sua estrutura político-administrativa.

Qual das associações abaixo apresenta a relação entre o evento e a sua causa direta?`,op:[["a","Criação do Vice-Reino do Brasil – Tratado de Santo Ildefonso"],["b","Fim das Capitanias Hereditárias – domínio espanhol durante a União Ibérica"],["c","Criação do Estado do Maranhão – ameaças estrangeiras à região amazônica"],["d","Mudança da capital para o Rio de Janeiro – ocupação holandesa do Nordeste"],["e","Subordinação do Vice-Rei ao Conselho Ultramarino – Insurreição Pernambucana"]],g:"c"},
{n:46,f:"Questões POP Prof Rina/3053217 - MOVENS - Pref São Luís/2007",t:`Minha Terra natal, em Guaxenduba;
Na trincheira, em que o luso ainda trabalha,
A artilharia, que ao francês derruba,
Por três bocas letais pragueja e ralha.
O leão de França, arregaçando a juba,
Saltou. E o luso, como um tigre, o atalha.
Troveja a boca do arcabuz, e a tuba
Do índio corta o clamor e o medo espalha.
Foi então que se viu, sagrando a guerra,
Nossa Senhora, com o Menino ao colo,
Surgir lutando pela minha terra.
Foi-lhe vista na mão a espada em brilho...
(Pátria, se a Virgem quis assim teu solo,
Que por ti não fará quem for teu filho?)
(Humberto de Campos)

Assinale a opção que apresenta o fato histórico maranhense relacionado com o soneto de Humberto de Campos.`,op:[["a","A Batalha de São Luís, que impediu a invasão francesa no Maranhão em 1612."],["b","A Batalha de Guaxenduba, que impediu a invasão francesa no Maranhão em 1612."],["c","A Batalha de Guaxenduba, de onde se originou a lenda da aparição de Nossa Senhora."],["d","A Batalha de São Luís, quando os portugueses expulsaram os franceses do território do Maranhão."],["e","A Batalha de Guaxenduba, quando ocorreu a vitória de Duque de Caxias sobre os invasores franceses."]],g:"c"},
{n:47,f:"Questões POP Prof Rina/1108633 - FCC - SM PM MA/2006",t:`No início do século XVII, os franceses tentaram organizar uma colônia no Brasil. Para isso, fundaram a chamada de França Equinocial, no Maranhão. Identifique os fatos históricos associados a essa colonização.

I. Contrariando as determinações do rei francês, Daniel de La Touche autorizou a difusão da religião dos protestantes entre os indígenas no Maranhão.
II. Com o objetivo de fixar a colonização no Brasil, os franceses construíram o forte que denominaram de São Luís, em homenagem ao rei francês.
III. Um dos ordenamentos instituídos na França Equinocial era a conversão da população ao cristianismo, segundo determinação do rei da França.
IV. Os franceses fundaram a França Equinocial para garantir a posse das terras do Maranhão, conforme determinava as normas do Tratado de Tordesilhas.

É correto o que se apresenta APENAS em`,op:[["a","I e II."],["b","I e III."],["c","II e III."],["d","II e IV."],["e","III e IV."]],g:"c"},
{n:48,f:"Questões POP Prof Rina/1108634 - FCC - SM PM MA/2006",t:`Em 1684, eclodiu uma revolta de proprietários de terra no Maranhão, conhecida por Revolta de Bequimão. Os revoltosos posicionaram-se`,op:[["a","contra o monopólio da companhia de comércio e contra os jesuítas."],["b","contra a escravidão dos africanos e dos indígenas maranhenses."],["c","a favor da catequização dos indígenas realizada pelos jesuítas."],["d","a favor do monopólio real sobre a exploração dos produtos da região."],["e","contra a expulsão dos jesuítas determinada pela coroa portuguesa"]],g:"a"},
{n:49,f:"Questões POP Prof Rina/1108635 - FCC - SM PM MA/2006",t:`A Batalha do Jenipapo foi um movimento`,op:[["a","contra as forças nacionalistas que lutavam pela independência política do Brasil."],["b","decisivo para a consolidar a independência e a configuração geográfica do Brasil."],["c","organizado pelos portugueses para resistir ao processo de independência do Brasil."],["d","idealizado pela burguesia, que defendia o pacto colonial entre Portugal e Brasil."],["e","promovido pelos estados do Nordeste que pretendiam se separar do Brasil."]],g:"b"},
{n:50,f:"Questões POP Prof Rina/1108637 - FCC - SM PM MA/2006",t:`Os chamados "republicanos de 16 de novembro" acabaram roubando a cena política dos republicanos históricos na maior parte dos estados brasileiros. O "festival" adesionista foi tamanho que deixou incomodado um conjunto de republicanos idealistas. O editorial de 18 de novembro de 1891 do jornal "Pacotilha", ao fazer a avaliação dos dois primeiros anos de República afirma que tão logo fora nomeada a Junta Governativa, em 18 de novembro de 1889, tornou-se difícil encontrar monarquistas no Maranhão.
(Luis Alberto Ferreira. In: www.outrostempos.uema.br)

A análise do texto permite afirmar que`,op:[["a","não havia políticos monarquistas na província do Maranhão antes do novo regime."],["b",`os "republicanos de 16 de novembro" proclamaram a República no Maranhão.`],["c","os maranhenses republicanos demitiram os monarquistas dos cargos políticos."],["d","os republicanos maranhenses condenaram os monarquistas ao exílio político."],["e","os monarquistas maranhenses não tiveram receio em aderir ao novo regime."]],g:"e"},
{n:51,f:"Questões POP Prof Rina/1719664 - Marinha - QT/2006",t:`A França Equinocial foi uma colônia francesa fundada no`,op:[["a","Rio de Janeiro."],["b","Pará."],["c","Maranhão."],["d","Amazonas."],["e","Piauí."]],g:"c"},
{n:52,f:"Questões POP Prof Rina/2053607 - ESAG - Pref São Luís/2006",t:`"A fundação de São Luís, hoje capital do Estado do Maranhão, está ligada a uma invasão estrangeira, que visava não só o contrabando do pau-brasil, mas principalmente a ocupação efetiva da região". Essa invasão foi realizada nos inícios do século XVII, pelos:`,op:[["a","franceses, comandados por Daniel de La Touche."],["b","holandeses, comandados por Maurício de Nassau."],["c","ingleses, comandados pelo português João de Barros."],["d","espanhóis, comandados por Felipe II, rei da Espanha."]],g:"a"}
];

const GEOGRAFIA = [
{n:1,f:"Questões Pop Prof RIna/2802685 - LJ Assessoria - Pref Turilândia/2024",t:`No futuro o Maranhão passará a produzir petróleo e gás natural. Uma das áreas é um bloco em Barreirinhas, na costa do Estado, em uma estrutura de:`,op:[["a","Bacias sedimentares"],["b","Dobramentos modernos"],["c","Crátons"],["d","Maciços antigos"],["e","Escudos cristalinos"]],g:"a"},
{n:2,f:"Questões Pop Prof RIna/2802690 - LJ Assessoria - Pref Turilândia/2024",t:`É uma cidade estrategicamente localizada ao sul do Maranhão, entre as regiões norte, nordeste e centro-oeste, com grande extensão de terras propícias para o cultivo agrícola da soja. É um dos polos agrícolas de grande destaque do Maranhão. A cidade retratada no texto é:`,op:[["a","Balsas"],["b","Açailândia"],["c","Santa Inês"],["d","Imperatriz"],["e","Tocantinópolis"]],g:"a"},
{n:3,f:"Questões Pop Prof RIna/2514228 - SUCONS UEMA - PSS UEMA 60+/2023",t:`Leia o texto.

Os Biomas Brasileiros
Bioma é um conjunto de vida vegetal e animal, constituído pelo agrupamento de tipos de vegetação contíguos e que podem ser identificados em nível regional, com condições de geologia e de clima semelhantes e que, historicamente, sofreram os mesmos processos de formação da paisagem, resultando em uma diversidade de flora e de fauna própria. Em nosso país existem seis tipos de biomas (Amazônia, Mata Atlântica, Cerrado, Caatinga, Pampa e Pantanal), sendo um deles considerado o maior bioma brasileiro e o possuidor da maior floresta tropical do mundo, a Amazônia. (IBGE)

O Maranhão, estado que integra a macrorregião Nordeste, está situado em uma área de transição entre três biomas. São eles:`,op:[["a","Caatinga, Cerrado e Mata Atlântica."],["b","Pampas, Amazônia e Cerrado."],["c","Amazônia, Caatinga e Cerrado."],["d","Caatinga, Cerrado e Manguezal."],["e","Mata Atlântica, Pantanal e Cerrado."]],g:"c"},
{n:4,f:"Questões Pop Prof RIna/2514234 - SUCONS UEMA - PSS UEMA 60+/2023",t:`Entenda o fenômeno que causa crateras e ameaça "engolir" cidades no Maranhão.

As primeiras [...] se formaram a partir da rápida expansão urbana de Buriticupu, como consequência do desmatamento da vegetação nativa em áreas de alta declividade, é o que explica ao g1, o professor Fernando Bezerra, do programa de pós-graduação em Geografia, Natureza e Dinâmica do Espaço, da Universidade Estadual do Maranhão (UEMA).

"A malha urbana da cidade, e seus sistemas de arruamentos, aliadas aos fortes eventos pluviométricos, contribui também com o grande volume de água (enxurradas) que chegam no interior dessas [...], aumentando o risco de avanço nas residências locais", explicou o professor.

[Foto aérea: cratera de erosão em Buriticupu - MA]

O fenômeno que teve grande destaque nas imprensas estadual e nacional, nos meses de março e de abril de 2023, no município de Buriticupu - MA, dá origem a formas de relevo conhecidas, cientificamente, por`,op:[["a","Chapadas."],["b","Serras."],["c","Planícies."],["d","Falésias."],["e","Voçorocas."]],g:"e"},
{n:5,f:"Questões Pop Prof RIna/2514386 - SUCONS UEMA - PSS UEMA 60+/2022",t:`As águas de março causam muitos problemas para a capital maranhense, conforme publicado em diferentes mídias.

Ruas, avenidas e espaços públicos, alagados, com carros arrastados pela correnteza. Este foi o cenário em vários pontos de São Luís, na tarde desta terça-feira, após uma chuva forte que teve, aproximadamente, duas horas de duração.

[Foto: ponto de alagamento em São Luís-MA]

A existência de pontos de alagamentos em São Luís está relacionada, principalmente,`,op:[["a","à expansão de saneamento básico e às chuvas esporádicas em São Luís."],["b","aos deslizamentos de colinas e às chuvas torrenciais."],["c","às ocorrências de rios no espaço urbanos e às chuvas de verão."],["d","à canalização dos rios urbanos e às chuvas sazonais em São Luís."],["e","ao sistema de drenagem urbana ineficiente e à ocorrência de chuvas intensas."]],g:"e"},
{n:21,f:"Questões Pop Prof RIna/1008561 - FCC - TJ MA/2019",t:`A bacia hidrográfica do rio Mearim, com aproximadamente 99.000 km², está totalmente inserida no território do Estado do Maranhão. Sobre ela é correto afirmar que`,op:[["a","seu rio principal tem suas nascentes nas encostas setentrionais da Serra da Menina, em altitudes de 400 a 500 m aproximadamente, e seu curso total é de cerca de 930 km."],["b","o rio Mearim nasce nas elevações que formam o divisor entre as bacias hidrográficas dos rios Pindaré e Tocantins e deságua na baía de São Marcos depois de percorrer cerca de 870 km."],["c","abrange 73 municípios, dos quais 30 têm todo o seu território no interior da bacia e os demais municípios têm a sua sede situada no interior de outras bacias."],["d","apresenta as maiores concentrações demográficas na porção sul, onde ocorrem densidades que variam entre 20 e 35 hab/km², situação diferente do que ocorre na porção norte."],["e","ocupa, no sul e sudeste, extensa área de planaltos e serras cristalinas e nas porções central e setentrional ocupa áreas de depressões e planícies cujas altitudes variam entre 100 e 200 metros."]],g:"a"},
{n:22,f:"Questões Pop Prof RIna/1008563 - FCC - TJ MA/2019",t:`Considere o gráfico e as afirmações a seguir.

[Gráfico: Maranhão - Evolução da população urbana (%) - 1960: ~18% urbana/82% rural; 1991: ~40% urbana/60% rural; 2000: ~60% urbana/40% rural; 2010: ~63% urbana/37% rural. Fonte: IBGE Censos]

I. No período entre 1960 e 2010, o número de municípios no estado cresceu mais de 100%, totalizando 217; no entanto, apenas 10 municípios concentram 1/3 da população maranhense.
II. A criação da região metropolitana de São Luís, no início da década de 1990, deu forte impulso à urbanização do estado e, em 2017, a Grande São Luís tornou-se a terceira região metropolitana do Nordeste.
III. Nas últimas décadas, o êxodo rural e o avanço da tecnologia no campo tiveram forte impacto sobre a redução da população rural e, consequentemente, sobre o total de trabalhadores rurais no estado.

Está correto o que se afirma APENAS em`,op:[["a","I e II."],["b","I."],["c","I e III."],["d","II."],["e","II e III."]],g:"c"},
{n:23,f:"Questões Pop Prof RIna/1008564 - FCC - TJ MA/2019",t:`Considere o mapa e os textos a seguir.

[Mapa: Maranhão - Mesorregiões numeradas de 1 a 5: região 3 ao norte, região 2 a nordeste/leste, região 1 no centro, região 4 a oeste, região 5 ao sul]

I. Com 52 municípios, produziu 21,1% do PIB do estado em 2015, concentrando 17,4% do mercado de trabalho formal estadual. Revela maior predominância nas atividades econômicas da indústria, com peso da construção civil e da indústria de transformação, agregada à produção de papel e celulose. Cabe notar o destaque da formação de riqueza gerada no município que participa com 7,6% do PIB Estadual, sediando o parque fabril da empresa Suzano Papel e Celulose.

II. A Mesorregião participou com 8,7% do PIB estadual em 2015. Embora composta por 19 municípios e com pouco mais de 5,3% do emprego formal do estado, a Mesorregião apresenta o maior PIB per capita maranhense, influenciado pelo complexo soja-milho e algodão, e o menor contingente populacional, com 4,7% da população do estado.

Os textos I e II descrevem, respectivamente, as mesorregiões`,op:[["a","4 e 3."],["b","2 e 1."],["c","1 e 5."],["d","4 e 5."],["e","2 e 4."]],g:"d"},
{n:24,f:"Questões Pop Prof RIna/1009584 - FCC - TJ MA/2019",t:`A respeito da natureza maranhense é correto afirmar que`,op:[["a","o clima predominante é o equatorial, com elevadas temperaturas durante todo o ano e secas pronunciadas nos primeiros meses do ano; a leste encontra-se o clima tropical sem estação seca."],["b","a presença de clima com chuvas irregulares durante o ano provoca o aparecimento de inúmeros rios intermitentes, principalmente a oeste do estado."],["c","o relevo maranhense apresenta topografia regular, com aproximadamente 90% da superfície acima de 500 metros de altitude; o ponto mais elevado está no sul do estado, na serra dos Penitentes."],["d","o estado é formado por dois grandes biomas: a Amazônia e o Cerrado e outros dois de transição, a Amazônia/Cerrado e a Caatinga/Cerrado, além dos mangues, totalizando biomas de grande biodiversidade."],["e","a estrutura geológica do estado é predominantemente antiga datando as eras Arqueozoica e Proterozoica e, portanto, já muito alterada; apenas no sul do estado são encontrados terrenos mais novos."]],g:"d"},
{n:25,f:"Questões Pop Prof RIna/1009586 - FCC - TJ MA/2019",t:`Considere os dados da tabela a seguir.
